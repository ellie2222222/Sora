# Optional containerized path, alongside (not replacing) the documented npm +
# host-Postgres workflow — see README.md's "Docker" section for when to reach
# for this instead.
#
# Postgres's host port defaults to 5432 — the same port the documented host
# workflow (Postgres 17 run directly on the host) also uses. Override
# POSTGRES_HOST_PORT in .env before bringing this stack up if a host Postgres
# is already running, or the two will collide on the port.
#
# `docker compose up -d --build` starts postgres → migrate (one-shot) → server.
# The database GUIs are opt-in: `docker compose --profile gui up -d pgadmin adminer`.
services:
  postgres:
    image: postgres:17
    container_name: sora-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sora_dev}
    # Loopback by default: the database has no business being reachable from the LAN.
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - sora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sora} -d ${POSTGRES_DB:-sora_dev}' ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: sora-server:local
    container_name: sora-migrate
    command: ['node', 'scripts/migrate.mjs']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sora}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sora_dev}
    # The image's HEALTHCHECK probes the API, which this one-shot container never serves.
    healthcheck:
      disable: true
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: sora-server:local
    container_name: sora-server
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sora}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sora_dev}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      PORT: 3000
      NODE_ENV: production
      # Not defaulted or required here: server/src/config/env.ts already refuses to
      # boot without a usable JWT_SECRET/GOOGLE_CLIENT_ID, and a `:?` guard on
      # these would also block `docker compose build`, which never reads them.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-sora-server}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://open.er-api.com/v6/latest}
      EXCHANGE_RATE_TIMEOUT_SECONDS: ${EXCHANGE_RATE_TIMEOUT_SECONDS:-5}
      EXCHANGE_RATE_CACHE_TTL_MINUTES: ${EXCHANGE_RATE_CACHE_TTL_MINUTES:-720}
    ports:
      - '${API_HOST_PORT:-3000}:3000'

  # GUIs reach either the container (`postgres:5432`) or a host Postgres
  # (`host.docker.internal:5432`), so they don't depend on the postgres service.
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: sora-pgadmin
    profiles: ['gui']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sora.com}
      # Not `:?` — compose resolves every service's variables even when its profile is off, which would
      # block the default `up`. pgAdmin itself refuses to start with an empty password.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - '${PGADMIN_HOST_PORT:-5050}:80'
    volumes:
      - sora_pgadmin_data:/var/lib/pgadmin
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  adminer:
    image: adminer:6
    container_name: sora-adminer
    profiles: ['gui']
    ports:
      - '${ADMINER_HOST_PORT:-8080}:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  sora_postgres_data:
  sora_pgadmin_data:
