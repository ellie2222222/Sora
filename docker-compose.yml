# Optional containerized path, alongside (not replacing) the documented npm +
# host-Postgres workflow in CLAUDE.md/README — see the "Docker" section there
# for when to reach for this instead.
#
# Postgres's host port defaults to 5433, not 5432: the documented dev workflow
# runs Postgres 17 directly on the host at :5432, and this stack is meant to
# run alongside that, not fight it for the port. Override POSTGRES_HOST_PORT
# in .env if nothing is listening on 5432 and you'd rather use it directly.
services:
  postgres:
    image: postgres:17
    container_name: sora-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sora}
      POSTGRES_DB: ${POSTGRES_DB:-sora_dev}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - sora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sora}']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sora-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sora}:${POSTGRES_PASSWORD:-sora}@postgres:5432/${POSTGRES_DB:-sora_dev}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      PORT: 3001
      NODE_ENV: production
      # Not defaulted or required here: server/src/config/env.ts already refuses to
      # boot without a usable JWT_SECRET/GOOGLE_CLIENT_ID, and a `:?` guard on
      # these would also block `docker compose build`, which never reads them.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-sora-server}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - '${API_HOST_PORT:-3001}:3001'

volumes:
  sora_postgres_data:
