version: '3.8'

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sora-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sora.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  adminer:
    image: adminer:latest
    container_name: sora-adminer
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
