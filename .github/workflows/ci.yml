name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # The shared contract is checked on its own and first: every other job depends
  # on it, so a break here should report as one clear failure rather than as a
  # confusing cascade in the api and mobile jobs.
  contracts:
    name: Contracts (types, tests, parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @finance/contracts

      - name: Unit tests (money and derivation math)
        run: npm run test --workspace @finance/contracts

      # Asserts the enum members, error-code map and route list agree with the
      # SQL CHECK constraints and the API specification. A drift here would
      # otherwise surface as a 500 from Postgres at runtime.
      - name: Contract/schema parity
        run: node scripts/check-contract-parity.mjs

  database:
    name: Database (migrations, constraints)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Applies every migration in order, then runs db/tests/*.sql, which probe
      # that each constraint rejects what the business rules say it rejects.
      # Passing migrations prove only that the DDL parses; the probes are what
      # prove the rules are actually enforced.
      - name: Migrate and run constraint suites
        env:
          DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_ci
        run: node scripts/migrate.mjs --constraints

      - name: Re-run to prove migrations are idempotent
        env:
          DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_ci
        run: node scripts/migrate.mjs

  api:
    name: API (types, tests)
    runs-on: ubuntu-latest
    needs: contracts

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build contracts
        run: npm run build --workspace @finance/contracts

      - name: Typecheck
        run: npm run typecheck --workspace @finance/api

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_test
        run: node scripts/migrate.mjs

      - name: Tests
        env:
          DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_test
          JWT_SECRET: ci-only-secret-not-used-anywhere-else
        run: npm run test --workspace @finance/api

  mobile:
    name: Mobile (types, tests, bundle)
    runs-on: ubuntu-latest
    needs: contracts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build contracts
        run: npm run build --workspace @finance/contracts

      - name: Typecheck
        run: npm run typecheck --workspace @finance/mobile

      - name: Tests
        run: npm run test --workspace @finance/mobile

      # No emulator runs in CI, so a successful bundle is the strongest
      # available evidence that every import resolves and the app would start.
      - name: Export bundle
        working-directory: mobile
        run: npx expo export --platform web --output-dir /tmp/expo-export
